services:
  db:
    image: postgres:16-alpine
    container_name: capstone-ticket-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: ticket_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ticket_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_admin -d tickets"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: capstone-ticket-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgres://ticket_admin:${POSTGRES_PASSWORD}@db:5432/tickets
      CORS_ORIGIN: http://${PUBLIC_IP}:5173
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: development
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: capstone-ticket-ui
    restart: unless-stopped
    environment:
      VITE_API_URL: http://${PUBLIC_IP}:4000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  ticket_db_data:
